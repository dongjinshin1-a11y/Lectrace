name: Build and Deploy LecTrace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install LecTrace
        run: |
          uv venv
          uv pip install lectrace
      - name: Build presentation
        run: uv run lectrace build --output _site
      - name: Validate complete trace and exporter
        run: |
          python -m py_compile colab_export_real_forward.py 01_pathmnist_colour_robustness.py
          python - <<'PY'
          from pathlib import Path
          source = Path('01_pathmnist_colour_robustness.py').read_text()
          cues = ('0:00–2:20', '2:20–3:15', '3:15–4:35', '4:35–6:40',
                  '6:40–7:50', '7:50–9:20', '9:20–10:00')
          assert all(source.count('note(\'' + cue) == 1 for cue in cues), 'Missing/duplicated 10-minute presenter cue'
          assert source.count('# State ') == 5, 'Expected exactly five selected execution states'
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          trace = json.loads(Path('_site/traces/01_pathmnist_colour_robustness.json').read_text())
          steps = trace['steps']
          assert trace['metadata']['error'] is None
          assert len(steps) >= 95, f'Unexpectedly truncated lecture: {len(steps)} steps'
          last = steps[-1]['stack'][-1]['source_line']
          assert '9:20' in last, 'Final 9:20–10:00 conclusion is not reachable'
          prior = steps[96]['stack'][-1]['source_line']
          print('Validated step count:', len(steps), '| step 97:', prior.strip())
          print('Validated final conclusion:', last[:70])
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
